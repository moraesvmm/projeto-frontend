<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vero Sabore</title>

    <!--CDN do Bootstrap para CSS-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="index.html">
          <img class="brand__logo" src="assets/img/logo-vero-sabore.svg" alt="Logo Vero Sabore" />
          <span class="brand__copy">
            <span class="brand__name">Vero Sabore</span>
            <span class="brand__subtitle">Seu site de receitas italianas preferido.</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Categorias de receitas">
          <ul class="site-nav__list">
            <li><a class="site-nav__link" href="index.html" aria-current="page">Início</a></li>
            <li><a class="site-nav__link" href="pages/massas.html">Massas</a></li>
            <li><a class="site-nav__link" href="pages/sobremesas.html">Sobremesas</a></li>
            <li><a class="site-nav__link" href="pages/lanches.html">Lanches</a></li>
            <li><a class="site-nav__link" href="pages/drinks.html">Drinks</a></li>
          </ul>
        </nav>
        <div class="site-actions">
          <button id="btnReceitasItalianas" class="header-button" type="button">Italianas</button>
          <button id="btnEspeciais" class="header-button header-button--quiet" type="button">Especiais</button>
        </div>
        <form id="formBusca" class="header-search">
          <input id="inputBusca" type="search" placeholder="Buscar receita" aria-label="Buscar receita" />
          <button id="btn-buscar" type="submit" aria-label="Buscar">
            <i class="bi bi-search" aria-hidden="true"></i>
          </button>
        </form>
      </div>
    </header>

    <main class="site-main home-main">
      <section class="home-intro">
        <div>
          <h1>Receitas italianas</h1>
          <p class="home-intro__copy">Massas, sobremesas, lanches e drinks.</p>
        </div>
      </section>

      <section aria-label="Receitas italianas">
        <div id="detalheReceita"></div>
        <div id="resultadoBusca" class="recipe-grid" aria-live="polite"></div>
      </section>

      <section class="category-section" aria-labelledby="categoryTitle">
        <div class="section-heading">
          <h2 id="categoryTitle">Categorias</h2>
        </div>
        <div class="category-grid">
          <a class="category-card" href="pages/massas.html">
            <img class="category-card__image" src="https://www.themealdb.com/images/media/meals/usywpp1511189717.jpg" alt="Massa italiana com camarões" loading="lazy" />
            <span class="category-card__body">
              <span class="category-card__title">Massas</span>
              <span class="category-card__arrow" aria-hidden="true">&rarr;</span>
            </span>
          </a>
          <a class="category-card" href="pages/sobremesas.html">
            <img class="category-card__image" src="https://www.themealdb.com/images/media/meals/wkhg581762773124.jpg" alt="Sobremesa dourada recém-preparada" loading="lazy" />
            <span class="category-card__body">
              <span class="category-card__title">Sobremesas</span>
              <span class="category-card__arrow" aria-hidden="true">&rarr;</span>
            </span>
          </a>
          <a class="category-card" href="pages/lanches.html">
            <img class="category-card__image" src="https://www.themealdb.com/images/media/meals/5jdtie1763289302.jpg" alt="Ajo blanco servido como entrada" loading="lazy" />
            <span class="category-card__body">
              <span class="category-card__title">Lanches</span>
              <span class="category-card__arrow" aria-hidden="true">&rarr;</span>
            </span>
          </a>
          <a class="category-card" href="pages/drinks.html">
            <img class="category-card__image" src="https://www.thecocktaildb.com/images/media/drink/yqvvqs1475667388.jpg" alt="Drink 155 Belmont" loading="lazy" />
            <span class="category-card__body">
              <span class="category-card__title">Drinks</span>
              <span class="category-card__arrow" aria-hidden="true">&rarr;</span>
            </span>
          </a>
        </div>
      </section>
    </main>

    <!--Script do Bootstrap-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!--Script do main-->
    <script src="assets/js/main.js"></script>
  </body>
</html>
